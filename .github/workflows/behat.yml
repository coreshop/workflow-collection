name: Behat
on:
  workflow_call:
    inputs:
      runs_on:
        type: string
        default: '["ubuntu-latest"]'
      install-data-hub:
        required: false
        type: boolean
        default: true
      run-symfony-server:
        required: false
        type: boolean
        default: true
      behat-profile:
        required: false
        type: string
        default: "default"
      run-bundle-installer:
        required: false
        type: string
      php_versions:
        description: "JSON array of PHP versions for the test matrix. The default matches CoreShop 5 (PHP ^8.3)."
        required: false
        type: string
        default: '["8.3", "8.4"]'
      pimcore_versions:
        description: "JSON array of Pimcore version constraints for the test matrix."
        required: false
        type: string
        default: '["^12.0"]'

permissions:
  contents: read

jobs:
  behat:
    runs-on: ${{fromJSON(inputs.runs_on)}}
    env:
      APP_ENV: "test"
      CORESHOP_SKIP_DB_SETUP: "1"
      # Pimcore 12 requires these at container compile time. Values come from
      # the coreshop org secrets; callers pass them via `secrets: inherit`.
      PIMCORE_SECRET: "${{ secrets.PIMCORE_SECRET }}"
      PIMCORE_INSTALL_ENCRYPTION_SECRET: "${{ secrets.PIMCORE_SECRET }}"
      PIMCORE_INSTANCE_IDENTIFIER: "${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}"
      PIMCORE_INSTALL_INSTANCE_IDENTIFIER: "${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}"
      PIMCORE_PRODUCT_KEY: "${{ secrets.PIMCORE_PRODUCT_KEY }}"
      PIMCORE_INSTALL_PRODUCT_KEY: "${{ secrets.PIMCORE_PRODUCT_KEY }}"
      PIMCORE_TEST_DB_DSN: "mysql://root:root@127.0.0.1:3306/coreshop_test"
      # The Pimcore 12 installer's names. The 2026 installer resolves every
      # parameter by its own exact env var name and falls back to the
      # parameter's default otherwise, so it reads none of these — it needs the
      # three below instead. Both sets are kept because this workflow serves
      # callers on both lines; each installer ignores the other's names.
      PIMCORE_INSTALL_ADMIN_USERNAME: "admin"
      PIMCORE_INSTALL_ADMIN_PASSWORD: "admin"
      PIMCORE_INSTALL_MYSQL_HOST_SOCKET: "127.0.0.1"
      PIMCORE_INSTALL_MYSQL_USERNAME: "root"
      PIMCORE_INSTALL_MYSQL_PASSWORD: "root"
      PIMCORE_INSTALL_MYSQL_DATABASE: "coreshop_test"
      PIMCORE_INSTALL_MYSQL_PORT: "3306"
      PANTHER_EXTERNAL_BASE_URI: "http://localhost:9080/index_test.php"
      PANTHER_CHROME_ARGUMENTS: "--disable-dev-shm-usage"
      PIMCORE_KERNEL_CLASS: 'Kernel'
      # Read by the Pimcore 2026 installer, inert on ^12.*: the admin credentials
      # replace the PIMCORE_INSTALL_ADMIN_* pair above, and DATABASE_URL replaces
      # the PIMCORE_INSTALL_MYSQL_* set — without it the installer silently falls
      # back to its default 'mysql://pimcore:pimcore@127.0.0.1:3306/pimcore'
      # instead of the database the Setup DB step creates. Same values as
      # coreshop/CoreShop's own 2026.x behat workflow.
      PIMCORE_ADMIN_USER: "admin"
      PIMCORE_ADMIN_PASSWORD: "admin"
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/coreshop_test"
      # Only consumed on Pimcore 2026, which installs the Generic Data Index and
      # therefore needs a reachable OpenSearch. Inert on ^12.*, where nothing
      # reads it.
      PIMCORE_OPENSEARCH_DSN: "opensearch://127.0.0.1:9200?ssl=false&ssl_verify=false"

    strategy:
      matrix:
        php: ${{ fromJSON(inputs.php_versions) }}
        pimcore: ${{ fromJSON(inputs.pimcore_versions) }}
        dependencies: [ highest ]

    services:
      database:
        image: "mysql:8"
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      # Needed by Pimcore 2026's Generic Data Index. Service containers cannot
      # be declared conditionally, so it also starts for ^12.* matrix entries,
      # where it just sits idle — nothing points at it. Configuration matching
      # coreshop/CoreShop's 2026.x behat workflow.
      opensearch:
        image: "opensearchproject/opensearch:2.11.1"
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
          action.auto_create_index: "false"
        ports:
          - 9200:9200

    name: "${{ matrix.pimcore }}, PHP ${{ matrix.php }}, Deps ${{ matrix.dependencies }}"

    steps:
    # A caller that forgets `secrets: inherit` reaches this workflow with every
    # secret empty. Pimcore 12.3 tolerated an empty encryption secret, but
    # 2026.1 aborts the container compile with '`pimcore.encryption.secret` is
    # not set' — an error that points at the bundle's config instead of at the
    # caller. Failing here names the actual cause.
    - name: Check that the org secrets arrived
      run: |
        if [ -z "${PIMCORE_SECRET:-}" ]; then
          echo "::error::PIMCORE_SECRET is empty. The calling workflow is missing 'secrets: inherit' (the coreshop org secrets are not passed to a called workflow by default)."
          exit 1
        fi

    - uses: actions/checkout@v4

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        ini-values: display_errors=On, display_startup_errors=On, error_reporting=32767
        extensions: intl, gd, simpleXML, dom, exif, fileinfo, iconv, mbstring, mysqli, pdo_mysql, zip, zlib
        tools: symfony

    - name: Check PHP Version
      run: php -v

    # Pimcore 2026.1 needs a different install procedure than ^12.* (see the
    # install step below), and this workflow serves callers on both lines. The
    # major version is derived once here so the steps that differ can gate on
    # it. Comparing the leading number keeps that independent of the constraint
    # syntax the caller passes (^2026.1, ~2026.1, 2026.1.*).
    - name: Determine the Pimcore major version
      id: pimcore-version
      env:
        PIMCORE_VERSION: ${{ matrix.pimcore }}
      run: |
        MAJOR="$(printf '%s' "$PIMCORE_VERSION" | tr -cd '0-9.' | cut -d. -f1)"
        echo "major=${MAJOR:-0}" >> "$GITHUB_OUTPUT"

    - name: Setup DB
      run: |
        mysql --host 127.0.0.1 --port ${{ job.services.database.ports['3306'] }} -uroot -proot -e "CREATE DATABASE coreshop_test CHARSET=utf8mb4;"

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
        restore-keys: ${{ runner.os }}-composer-

    - if: matrix.dependencies == 'highest'
      name: Install dependencies highest
      run: |
        composer req pimcore/pimcore:${{ matrix.pimcore }} --no-interaction --no-scripts --no-update
        composer update --no-progress --prefer-dist --optimize-autoloader

    - if: matrix.dependencies == 'lowest'
      name: Install dependencies lowest
      run: |
        composer req pimcore/pimcore:${{ matrix.pimcore }} --no-interaction --no-scripts --no-update
        composer update --no-progress --prefer-dist --optimize-autoloader --prefer-lowest

    - name: Assets Install
      run: bin/console assets:install --symlink

    # A 2026 install brings up the Generic Data Index, which talks to OpenSearch
    # during the install itself, so the client has to be configured before
    # pimcore-install runs. Same file as coreshop/CoreShop's 2026.x behat
    # workflow.
    - name: Configure the OpenSearch client
      if: ${{ fromJSON(steps.pimcore-version.outputs.major) >= 2026 }}
      run: |
        mkdir -p config/local
        cat > config/local/opensearch.yaml << 'EOF'
        pimcore_open_search_client:
          clients:
            default:
              hosts: ['http://127.0.0.1:9200']
              ssl_verification: false
        EOF

    # Pimcore 2026.1 replaced the installer's flags with a profile-based
    # interface: --skip-database-config no longer exists (the run aborts with
    # 'The "--skip-database-config" option does not exist'), and the bundles to
    # install plus the env-var definitions now come from an install profile.
    # CoreShopInstallProfile installs a bare Pimcore with the database wired up
    # and the Studio stack registered; everything CoreShop-specific follows in
    # the `coreshop:install` step below. Validation is skipped because the
    # database already exists — the Setup DB step created it.
    #
    # Invocation copied from coreshop/CoreShop's 2026.x behat workflow, which
    # notably does not pass --env: APP_ENV=test from the job env already selects
    # the environment. PIMCORE_KERNEL_CLASS comes from the job env too.
    - name: Install Pimcore (2026 install profile)
      if: ${{ fromJSON(steps.pimcore-version.outputs.major) >= 2026 }}
      run: |
        vendor/bin/pimcore-install --no-interaction \
          --install-profile 'CoreShop\Bundle\CoreBundle\InstallProfile\CoreShopInstallProfile' \
          --skip-validation

    - name: Install Pimcore
      if: ${{ fromJSON(steps.pimcore-version.outputs.major) < 2026 }}
      run: vendor/bin/pimcore-install --env=test --skip-database-config --no-interaction

    # The install profile registers the Studio and Generic Data Index bundles
    # but does not build what they need: the class definitions have to be
    # deployed and the search index created before anything writes objects, so
    # `coreshop:install` below would otherwise fail on a missing index. Same
    # commands and order as coreshop/CoreShop's 2026.x behat workflow. Classes
    # created by the installers that follow are picked up by the second index
    # pass further down.
    - name: Rebuild Pimcore classes and the search index
      if: ${{ fromJSON(steps.pimcore-version.outputs.major) >= 2026 }}
      run: |
        bin/console pimcore:deployment:classes-rebuild --force --create-classes
        bin/console generic-data-index:update:index -r

    - name: Install CoreShop
      run: |
        bin/console coreshop:install --no-interaction

    - name: Install Seperate Bundle
      if: ${{ inputs.run-bundle-installer != '' }}
      run: |
        bin/console pimcore:bundle:install ${{ inputs.run-bundle-installer }} --no-interaction

    - name: Install DataHub
      if: ${{ inputs.install-data-hub }}
      run: |
        bin/console pimcore:bundle:install PimcoreDataHubBundle
        bin/console datahub:graphql:rebuild-definitions
        composer dump-autoload

    # The installers above create class definitions of their own — CoreShop's
    # via `coreshop:install`, the bundle under test's via its bundle installer —
    # and each new class needs its own index. The Generic Data Index normally
    # builds those from queued messages, but no consumer runs in CI, so an index
    # only exists for the classes that were present when this command last ran.
    # Without a second pass, every search over a class created after the install
    # fails with index_not_found_exception once the suite runs.
    #
    # This is also why it has to happen before the web server starts: the Behat
    # UI profile drives requests that search those classes.
    - name: Update the search index for the newly installed classes
      if: ${{ fromJSON(steps.pimcore-version.outputs.major) >= 2026 }}
      run: bin/console generic-data-index:update:index -r

    - name: Run Symfony Webserver
      if: ${{ inputs.run-symfony-server }}
      run: symfony server:start --port=9080 --dir=public --daemon --no-tls

    - name: Run Behat
      run: vendor/bin/behat --strict --no-interaction -vvv -f progress --config behat.yml.dist -p ${{ inputs.behat-profile }}

    - name: Upload Pimcore logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: "Pimcore logs (non-JS, PHP ${{ matrix.php }}, Symfony ${{ matrix.pimcore }})"
        path: var/log/
        if-no-files-found: ignore

    - name: Upload Behat logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: "Behat logs (non-JS, PHP ${{ matrix.php }}, Symfony ${{ matrix.pimcore }})"
        path: etc/build/
        if-no-files-found: ignore
