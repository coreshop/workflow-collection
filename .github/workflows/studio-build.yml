name: Studio Frontend Build

# Builds a bundle's Pimcore Studio plugin and — on pushes to a development
# branch — commits the built assets back to that branch.
#
# This is the bundle counterpart to coreshop/CoreShop's shared-frontend-build
# workflow. Two things differ from the core monorepo:
#
#   * The npm project lives inside the bundle (src/Resources/assets/pimcore-studio)
#     and its rsbuild config aliases @coreshop/* into vendor/coreshop/core-shop,
#     so the PHP dependencies have to be installed before the frontend build.
#   * The bundles do not commit their npm lock file (it is gitignored because
#     it contains machine-local `file:` paths into vendor/), so dependencies are
#     installed with `npm install` rather than `npm ci`.

on:
  workflow_call:
    inputs:
      commit:
        description: >-
          Commit the built Studio assets back to the branch. Only enabled for
          pushes to a development branch — pull requests build for verification
          only, so their diffs stay limited to the actual source changes.
        type: boolean
        default: false
      assets_path:
        description: "Directory holding the Studio npm project (package.json, rsbuild.config.ts)."
        type: string
        default: 'src/Resources/assets/pimcore-studio'
      output_path:
        description: "Directory the build writes its <build-id> directories into."
        type: string
        default: 'src/Resources/public/studio'
      node_version:
        type: string
        default: '22'
      php_version:
        description: "PHP version used for `composer install`. Only the vendor sources are needed, so one version is enough."
        type: string
        default: '8.3'
      php_extensions:
        description: >-
          Extensions for setup-php. imap is included because the inbound email
          rules bundle requires php-imap/php-imap, whose platform requirement
          would otherwise abort `composer install`.
        type: string
        default: 'intl, gd, simpleXML, dom, exif, fileinfo, iconv, imap, mbstring, mysqli, pdo_mysql, zip, zlib'
      composer_command:
        type: string
        default: 'composer install --no-progress --prefer-dist --no-interaction'
      build_command:
        description: >-
          Command that runs the production build, executed in `assets_path` with
          CORESHOP_BUILD_ID set. rsbuild is invoked directly rather than through
          the bundles' `npm run build` script: that script generates a random
          build id, which would rewrite every asset path on every build.
        type: string
        default: 'npx rsbuild build'
      runs_on:
        type: string
        default: '["ubuntu-latest"]'

# No workflow-level `permissions`: it would override what the calling job
# grants, leaving the build job read-only even on the push build. Jobs declare
# what they need instead.
jobs:
  # Lets the caller be synced to every bundle repo, including those that have no
  # Studio plugin (yet). Repos without an assets directory skip the build
  # instead of failing.
  detect:
    runs-on: ${{ fromJSON(inputs.runs_on) }}

    permissions:
      contents: read

    outputs:
      has_assets: ${{ steps.detect.outputs.has_assets }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Look for Studio assets
        id: detect
        env:
          ASSETS_PATH: ${{ inputs.assets_path }}
        run: |
          if [ -f "${ASSETS_PATH}/package.json" ]; then
            echo 'has_assets=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_assets=false' >> "$GITHUB_OUTPUT"
            echo "No Studio assets in ${ASSETS_PATH} — nothing to build." >> "$GITHUB_STEP_SUMMARY"
          fi

  # No job-level `permissions` block: the job inherits what the calling workflow
  # grants, so the write scope needed for the commit only exists on the push
  # build.
  build:
    needs: detect
    if: ${{ needs.detect.outputs.has_assets == 'true' }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}

    steps:
      # The bundles' development branches are not protected, so GITHUB_TOKEN can
      # push the asset commit. Where a "CoreShop Studio Build" app is configured
      # (as on coreshop/CoreShop, whose release branches carry a ruleset), its
      # installation token is used instead so the commit is attributed to the bot
      # and can bypass the ruleset.
      #
      # Secrets cannot be read in an `if:` condition, so whether the app is
      # configured is determined in a step that can see them.
      - name: Check whether the build app is configured
        id: app-config
        if: ${{ inputs.commit }}
        env:
          APP_ID: ${{ secrets.STUDIO_BUILD_APP_ID }}
          PRIVATE_KEY: ${{ secrets.STUDIO_BUILD_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate a token for the asset commit
        id: app-token
        if: ${{ steps.app-config.outputs.configured == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.STUDIO_BUILD_APP_ID }}
          private-key: ${{ secrets.STUDIO_BUILD_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      # The Studio sources import @coreshop/* from vendor/coreshop/core-shop, so
      # the frontend build cannot run before the PHP dependencies are installed.
      - name: Install PHP dependencies
        run: ${{ inputs.composer_command }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # setup-node's built-in cache needs a committed lock file, which these
      # bundles do not have, so the npm cache is handled here instead.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles(format('{0}/package.json', inputs.assets_path)) }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        working-directory: ${{ inputs.assets_path }}
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run esbuild install script
        working-directory: ${{ inputs.assets_path }}
        run: npm rebuild esbuild

      - name: Check whether a type check is defined
        id: scripts
        working-directory: ${{ inputs.assets_path }}
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.["check-types"] ? 0 : 1)'; then
            echo 'check_types=true' >> "$GITHUB_OUTPUT"
          else
            echo 'check_types=false' >> "$GITHUB_OUTPUT"
          fi

      # Advisory only. The bundles' type check reports ~100 TS2307 errors that
      # originate in the aliased @coreshop/* sources under vendor/, not in the
      # bundle's own code: those sources resolve their imports against the
      # CoreShop monorepo's node_modules, which does not exist in a bundle
      # checkout. Nothing in a bundle repo can fix them, so a blocking step
      # would keep every bundle permanently red. The production build below is
      # the gate — it fails on anything that actually breaks the bundle, and
      # type errors still show up as a warning annotation on the run.
      - name: Run type checks (advisory, does not fail the build)
        if: ${{ steps.scripts.outputs.check_types == 'true' }}
        continue-on-error: true
        working-directory: ${{ inputs.assets_path }}
        run: npm run check-types

      # The build id is the output directory name and the public asset prefix, so
      # it has to change when the emitted assets change — and only then. A random
      # id per build (what the bundles' local `npm run build` uses) would make
      # every build a full delete/add of all assets in git.
      #
      # Inputs are the bundle's own Studio sources plus the CoreShop Studio
      # sources from vendor/, which the rsbuild aliases inline into the output.
      - name: Derive the build id
        id: build-id
        env:
          ASSETS_PATH: ${{ inputs.assets_path }}
        run: |
          BUILD_ID="$(
            {
              find "$ASSETS_PATH" -type f \
                -not -path '*/node_modules/*' -not -name 'package-lock.json' -print0
              find vendor/coreshop -type f -path '*/Resources/assets/pimcore-studio/*' \
                -not -path '*/node_modules/*' -not -name 'package-lock.json' -print0
            } \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -c1-32
          )"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "Build id: ${BUILD_ID}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run production build
        working-directory: ${{ inputs.assets_path }}
        env:
          CORESHOP_BUILD_ID: ${{ steps.build-id.outputs.build_id }}
        run: ${{ inputs.build_command }}

      # `git add --all --force` also stages deletions of stale build directories:
      # the rsbuild config removes the previous build id's directory before it
      # writes the new one.
      - name: Stage built assets
        id: stage
        env:
          OUTPUT_PATH: ${{ inputs.output_path }}
        run: |
          git add --all --force -- "$OUTPUT_PATH"
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Studio assets are up to date.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            {
              echo '### Studio assets changed by this build'
              echo
              echo '```'
              git diff --cached --stat
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit built assets
        if: ${{ inputs.commit && steps.stage.outputs.changed == 'true' }}
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          # Attribute the commit to whichever identity actually pushes it. The
          # numeric id in the noreply address is what links a commit to the bot
          # account on GitHub.
          if [ -n "$APP_SLUG" ]; then
            BOT_ID="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id 2>/dev/null || true)"
          fi
          if [ -n "${BOT_ID:-}" ]; then
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fi

          git commit -m 'Build Studio bundle'

          if git push origin HEAD:"${GITHUB_REF_NAME}"; then
            exit 0
          fi

          # A rejected push has two very different causes, and only one of them
          # is benign: the branch moved on while we were building, in which case
          # the newer push runs its own build and supersedes these assets.
          # Anything else — a ruleset rejection, a missing write scope — means the
          # assets never land, and that must not pass as a green job. HEAD~1 is
          # the commit this build started from.
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse "origin/${GITHUB_REF_NAME}")" != "$(git rev-parse HEAD~1)" ]; then
            echo "::notice::${GITHUB_REF_NAME} moved on during the build; the newer push rebuilds the assets."
            echo 'Push skipped: branch moved on during the build.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Could not push the built Studio assets to ${GITHUB_REF_NAME}. The branch did not move on, so the push was refused — check that the calling job grants `contents: write`, or configure the STUDIO_BUILD_APP_ID and STUDIO_BUILD_APP_PRIVATE_KEY secrets if the branch is protected by a ruleset."
          echo 'Push failed: built assets were not committed.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
