# ⚠️  CENTRALLY MANAGED FILE — DO NOT EDIT LOCALLY!
#
# This file is distributed from coreshop/workflow-collection via file sync
# (source: templates/behat-domain.yml, bundle name injected per repo). Local
# changes will be overwritten by the next sync run via PR.
#
# Minimal test setup for a bundle repo. Add further suites (e.g. a Behat UI
# workflow) as separate files next to this one — the sync only overwrites
# the files it manages.

name: Behat Domain
on:
  push:
    branches: [ '*.x' ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
      - 'README.md'
  pull_request:
    branches: [ '*.x' ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
      - 'README.md'

permissions:
  contents: read

jobs:
  behat:
    uses: coreshop/workflow-collection/.github/workflows/behat.yml@v1
    secrets: inherit
    # The matrix is passed here rather than left to the reusable workflow's
    # defaults because it belongs to a release line, not to the CI system: this
    # template is only ever written to a repo's default branch, which is the
    # current development line (2026.x). Its bundles require ~8.4 || ~8.5 and
    # CoreShop 2026.1, so the workflow's CoreShop 5 defaults (8.3/8.4, Pimcore
    # ^12.0) cannot even `composer install` here. Older release branches keep
    # the caller they were synced with, so their matrix stays whatever was
    # correct for them. Same reasoning as templates/static.yml.
    with:
      php_versions: '["8.4", "8.5"]'
      pimcore_versions: '["^2026.1"]'
      install-data-hub: false
      run-symfony-server: false
      run-bundle-installer: "{{ bundle }}"
