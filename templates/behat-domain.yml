# ⚠️  CENTRALLY MANAGED FILE — DO NOT EDIT LOCALLY!
#
# This file is distributed from coreshop/workflow-collection via file sync
# (source: templates/behat-domain.yml, bundle name injected per repo). Local
# changes will be overwritten by the next sync run via PR.
#
# Minimal test setup for a bundle repo. Add further suites (e.g. a Behat UI
# workflow) as separate files next to this one — the sync only overwrites
# the files it manages.

name: Behat Domain
on:
  push:
    branches: [ '*.x' ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
      - 'README.md'
  pull_request:
    branches: [ '*.x' ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
      - 'README.md'

permissions:
  contents: read

jobs:
  behat:
    uses: coreshop/workflow-collection/.github/workflows/behat.yml@v1
    secrets: inherit
    with:
      install-data-hub: false
      run-symfony-server: false
      run-bundle-installer: "{{ bundle }}"
